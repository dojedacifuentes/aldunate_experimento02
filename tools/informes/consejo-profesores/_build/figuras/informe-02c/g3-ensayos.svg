<svg xmlns="http://www.w3.org/2000/svg" width="586" height="198" viewBox="0 0 586 198" font-family="'Segoe UI', Calibri, Arial, sans-serif"><rect width="586" height="198" fill="#fff"/><rect x="0" y="6" width="279" height="150" fill="none" stroke="#e1e0d9" stroke-width="1.2"/><text x="14" y="30" font-size="12.5" font-weight="600" fill="#1f1f1f">Acceso libre, sin diseño</text><text x="14" y="51" font-size="11" fill="#52514e">La herramienta entrega la solución</text><path d="M139.5 116 l14 -22 h-9 v-16 h-10 v16 h-9 Z" fill="#c8860d"/><text x="139.5" y="134" font-size="11.5" fill="#1f1f1f" text-anchor="middle">Por debajo del punto de partida</text><text x="139.5" y="148" font-size="11.5" fill="#1f1f1f" text-anchor="middle">una vez retirada la herramienta</text><rect x="307" y="6" width="279" height="150" fill="none" stroke="#e1e0d9" stroke-width="1.2"/><text x="321" y="30" font-size="12.5" font-weight="600" fill="#1f1f1f">Tutor con andamiaje</text><text x="321" y="51" font-size="11" fill="#52514e">Retiene la respuesta y pide los pasos</text><path d="M446.5 72 l14 22 h-9 v16 h-10 v-16 h-9 Z" fill="#1f4e8c"/><text x="446.5" y="134" font-size="11.5" fill="#1f1f1f" text-anchor="middle">Ganancias de aprendizaje duplicadas</text><text x="446.5" y="148" font-size="11.5" fill="#1f1f1f" text-anchor="middle">frente a clase activa</text><text x="293" y="174" font-size="11" fill="#52514e" text-anchor="middle">La misma clase de tecnología. Lo que cambia es el diseño de la actividad.</text><text x="0" y="194" font-size="10" fill="#898781">Bastani et al., PNAS (2025), n ≈ 1.000. Kestin et al., Scientific Reports (2025), n ≈ 180. Magnitudes no comparables entre sí.</text></svg>