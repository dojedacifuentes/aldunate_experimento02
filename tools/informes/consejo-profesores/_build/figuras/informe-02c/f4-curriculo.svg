<svg xmlns="http://www.w3.org/2000/svg" width="586" height="236" viewBox="0 0 586 236" font-family="'Segoe UI', Calibri, Arial, sans-serif"><rect width="586" height="236" fill="#fff"/><rect x="0" y="6" width="187.33333333333334" height="204" fill="none" stroke="#e1e0d9" stroke-width="1.2"/><rect x="0" y="6" width="187.33333333333334" height="5" fill="#1f4e8c"/><text x="12" y="34" font-size="12.5" font-weight="600" fill="#1f1f1f">SOBRE la IA</text><text x="12" y="56" font-size="10" fill="#898781">EN QUÉ CONSISTE</text><text x="12" y="72" font-size="11" fill="#1f1f1f">Añadir contenido sobre qué</text><text x="12" y="85" font-size="11" fill="#1f1f1f">es, cómo funciona y qué</text><text x="12" y="98" font-size="11" fill="#1f1f1f">implica</text><text x="12" y="118" font-size="10" fill="#898781">QUÉ EXIGE</text><text x="12" y="134" font-size="11" fill="#1f1f1f">Crear una asignatura y</text><text x="12" y="147" font-size="11" fill="#1f1f1f">encontrarle hueco</text><line x1="12" y1="172" x2="175.33333333333334" y2="176" stroke="#e1e0d9"/><text x="12" y="190" font-size="10.5" fill="#52514e">Domina: 7 de 8 casos avanzados</text><rect x="199.33333333333334" y="6" width="187.33333333333334" height="204" fill="none" stroke="#e1e0d9" stroke-width="1.2"/><rect x="199.33333333333334" y="6" width="187.33333333333334" height="5" fill="#5b8ac4"/><text x="211.33333333333334" y="34" font-size="12.5" font-weight="600" fill="#1f1f1f">CON la IA</text><text x="211.33333333333334" y="56" font-size="10" fill="#898781">EN QUÉ CONSISTE</text><text x="211.33333333333334" y="72" font-size="11" fill="#1f1f1f">Usarla dentro de las</text><text x="211.33333333333334" y="85" font-size="11" fill="#1f1f1f">asignaturas existentes como</text><text x="211.33333333333334" y="98" font-size="11" fill="#1f1f1f">instrumento</text><text x="211.33333333333334" y="118" font-size="10" fill="#898781">QUÉ EXIGE</text><text x="211.33333333333334" y="134" font-size="11" fill="#1f1f1f">Que cada docente rediseñe</text><text x="211.33333333333334" y="147" font-size="11" fill="#1f1f1f">sus tareas y su evaluación</text><line x1="211.33333333333334" y1="172" x2="374.6666666666667" y2="176" stroke="#e1e0d9"/><text x="211.33333333333334" y="190" font-size="10.5" fill="#52514e">Se atasca: 1 de 8 casos</text><rect x="398.6666666666667" y="6" width="187.33333333333334" height="204" fill="none" stroke="#e1e0d9" stroke-width="1.2"/><rect x="398.6666666666667" y="6" width="187.33333333333334" height="5" fill="#a9c3e0"/><text x="410.6666666666667" y="34" font-size="12.5" font-weight="600" fill="#1f1f1f">PARA entornos mediados</text><text x="410.6666666666667" y="56" font-size="10" fill="#898781">EN QUÉ CONSISTE</text><text x="410.6666666666667" y="72" font-size="11" fill="#1f1f1f">Redefinir qué hace un</text><text x="410.6666666666667" y="85" font-size="11" fill="#1f1f1f">profesional cuando parte</text><text x="410.6666666666667" y="98" font-size="11" fill="#1f1f1f">del oficio se automatiza</text><text x="410.6666666666667" y="118" font-size="10" fill="#898781">QUÉ EXIGE</text><text x="410.6666666666667" y="134" font-size="11" fill="#1f1f1f">Revisar resultados de</text><text x="410.6666666666667" y="147" font-size="11" fill="#1f1f1f">aprendizaje y secuencia</text><line x1="410.6666666666667" y1="172" x2="574" y2="176" stroke="#e1e0d9"/><text x="410.6666666666667" y="190" font-size="10.5" fill="#52514e">Sin casos localizados</text><text x="0" y="232" font-size="10" fill="#898781">El orden no expresa jerarquía ni secuencia. Ninguna modalidad conduce automáticamente a la siguiente.</text></svg>